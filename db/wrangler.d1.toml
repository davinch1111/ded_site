# Config for the D1 ADMIN COMMANDS ONLY (schema apply, review queries).
#
# DELIBERATELY NOT AT site/wrangler.toml. A wrangler.toml at the project root
# would be picked up by the Pages project and switch it from DASHBOARD bindings
# to CONFIG-FILE bindings — silently changing how the live deployment is
# configured, and dropping every binding not repeated here. Pages never reads
# this path; only the `--config db/wrangler.d1.toml` npm scripts do.
#
# The Production binding for the contact Function is set in the Cloudflare
# dashboard: Pages → ded-site → Settings → Functions → D1 bindings,
# variable name DB → database ded-enquiries, for BOTH Production and Preview.

name = "ded-d1-admin"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ded-enquiries"
# The real database, created in the Cloudflare dashboard on 2026-09-28.
#
# NOT A SECRET. A D1 database_id is an identifier, not a credential — it grants
# nothing without an authenticated account, which is why it is committed while
# API tokens never are.
#
# It must match EXACTLY what the Pages binding points at. The parked branch
# broke because a placeholder id sent the schema to one database while the
# Function was bound to another, so every INSERT hit "no such table".
#
# For LOCAL testing, pass this same id — not the name — to pages dev:
#   --d1 "DB=399d2eda-0a03-49f1-8706-cfb4f970bbbe"
# `--d1 DB=ded-enquiries` resolves to a DIFFERENT local SQLite file.
database_id = "399d2eda-0a03-49f1-8706-cfb4f970bbbe"
